services:
  sse:
    image: node:20-alpine
    container_name: sse
    working_dir: /app
    environment:
      - LOGS=true
    volumes:
      - ./server.js:/app/server.js:ro
    command: node server.js
    network_mode: service:tailscale
    depends_on:
      - tailscale
    restart: unless-stopped

